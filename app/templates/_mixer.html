{# stems: lista (klucz, etykieta, opis, url) #}
<div class="mixer" data-stems='{{ stems|tojson }}' data-l-play="{{ t('tr.play') }}" data-l-pause="{{ t('tr.pause') }}">
  <div class="mixer-transport">
    <button type="button" class="btn mx-play" disabled aria-label="{{ t('tr.loading') }}">…</button>
    <input type="range" class="mx-seek" min="0" max="1000" value="0" aria-label="Pozycja" disabled>
    <span class="mx-time">0:00</span>
  </div>
  <ul class="mx-rows">
  {% for key,label,desc,url in stems %}
    <li class="mx-row" data-key="{{ key }}">
      <div class="name">{{ label }}<span>{{ desc }}</span></div>
      <button type="button" class="toggle mx-mute" aria-pressed="false" aria-label="{{ t('tr.mute') }}: {{ label }}">{{ t('tr.mute') }}</button>
      <button type="button" class="toggle mx-solo" aria-pressed="false" aria-label="{{ t('tr.solo') }}: {{ label }}">{{ t('tr.solo') }}</button>
      <input type="range" class="mx-vol" min="0" max="100" value="100" aria-label="{{ t('tr.volume') }}: {{ label }}">
    </li>
  {% endfor %}
  </ul>
</div>
