{% extends 'base.html' %}
{% block title %}{{ b.title }}{% endblock %}
{% block content %}
<nav class="crumbs"><a href="{{ url_for('blog') }}">{{ t('nav.blog') }}</a></nav>
<article class="prose" style="padding-top:32px">
  <p class="eyebrow">{{ b.date }}</p>
  <h1 style="margin-bottom:24px">{{ b.title }}</h1>
  <p class="lead" style="margin-bottom:32px">{{ b.lead }}</p>
  {{ b.body|safe }}
</article>
{% endblock %}
