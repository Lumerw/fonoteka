{% extends 'base.html' %}
{% block title %}{{ b.title }}{% endblock %}
{% block content %}
<nav class="crumbs"><a href="{{ url_for('blog') }}">{{ t('nav.blog') }}</a></nav>
<article class="prose">
  <h1>{{ b.title }}</h1><p class="muted">{{ b.date }}</p>
  <p class="lead">{{ b.lead }}</p>
  {{ b.body|safe }}
</article>
{% endblock %}
