<div class="option-cards" role="radiogroup" aria-label="{{ t('dn.preset') }}">
  {% for k,p in presets.items() %}
  <label class="option-card"><input type="radio" name="preset" value="{{k}}" {% if k=='szelak' %}checked{% endif %}>
    <span><strong>{{ p.label }}</strong><span>{{ t('dn.desc.' ~ k) }}</span></span></label>
  {% endfor %}
  {% if allow_none %}
  <label class="option-card"><input type="radio" name="preset" value="">
    <span><strong>{{ t('dn.none') }}</strong><span>{{ t('dn.desc.none') }}</span></span></label>
  {% endif %}
</div>
