<fieldset>
  <legend>{{ t('dn.preset') }}</legend>
  {% if allow_none %}<p><label><input type="radio" name="preset" value=""> {{ t('dn.none') }}</label></p>{% endif %}
  {% for k,p in presets.items() %}<p><label><input type="radio" name="preset" value="{{k}}" {% if k=='szelak' %}checked{% endif %}> {{ p.label }}</label></p>{% endfor %}
</fieldset>
<fieldset>
  <legend>{{ t('dn.strength') }}</legend>
  {% for v in [1,2,3] %}<label class="inline-opt"><input type="radio" name="strength" value="{{v}}" {% if v==2 %}checked{% endif %}> {{ t('dn.s' ~ v) }}</label>{% endfor %}
  <p><label><input type="checkbox" name="hum" value="1"> {{ t('dn.hum') }}</label></p>
</fieldset>
