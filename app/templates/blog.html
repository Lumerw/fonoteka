{% extends 'base.html' %}
{% block title %}{{ t('nav.blog') }}{% endblock %}
{% block content %}
<h1>{{ t('nav.blog') }}</h1>
{% if L!='pl' %}<p class="muted">{{ t('gen.only_pl') }}</p>{% endif %}
{% for b in posts %}
<article class="card"><h2><a href="{{ url_for('blog_post', slug=b.slug) }}">{{ b.title }}</a></h2><p class="muted">{{ b.date }}</p><p>{{ b.lead }}</p></article>
{% endfor %}
{% endblock %}
